<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miles Homework Helper</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      max-width: 800px;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 20px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
      background: black;
      color: white;
      border-radius: 6px;
    }
    #output {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      background: #f3f3f3;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Miles' Homework Helper</h1>

  <label>Instructions</label>
  <textarea id="instructions" placeholder="Describe what the teacher wants..."></textarea>

  <label>Your Text</label>
  <textarea id="text" placeholder="Paste your essay or homework text here..."></textarea>

  <button id="generateBtn">Generate</button>

  <div id="output"></div>

  <script>
    document.getElementById("generateBtn").addEventListener("click", async () => {
      const instructions = document.getElementById("instructions").value;
      const homework = document.getElementById("text").value;

      const output = document.getElementById("output");
      output.textContent = "⏳ Generating...";

      const response = await fetch("https://technixx26.app.n8n.cloud/webhook/teacher-reference", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          instructions: instructions,
          text: homework,
          mode: "text"
        }),
      });

      const data = await response.json();
      output.textContent = data.answer || "❌ No answer returned.";
    });
  </script>
</body>
</html>
