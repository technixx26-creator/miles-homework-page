<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miles' Homework Helper</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 900px;
      margin-top: 40px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 15px 0 5px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      font-size: 18px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #output {
      background: #eee;
      margin-top: 30px;
      padding: 20px;
      min-height: 80px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Miles' Homework Helper</h1>

    <label for="instructions">Instructions</label>
    <textarea id="instructions" placeholder="Describe what the teacher wants..."></textarea>

    <label for="text">Your Homework / Question</label>
    <textarea id="text" placeholder="Paste the homework problem or essay prompt here..."></textarea>

    <button id="generateBtn">Generate</button>

    <div id="output"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("generateBtn");
      const output = document.getElementById("output");

      btn.addEventListener("click", async () => {
        const instructions = document.getElementById("instructions").value.trim();
        const homework = document.getElementById("text").value.trim();

        if (!instructions && !homework) {
          output.textContent = "❌ Please enter instructions or homework text.";
          return;
        }

        btn.disabled = true;
        output.textContent = "⏳ Generating…";

        try {
          const response = await fetch(
            "https://technixx26.app.n8n.cloud/webhook/homework-v2",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                question: homework,
                instructions: instructions,
                subject: "",
                length: "",
                format: "auto"
              })
            }
          );

          if (!response.ok) {
            output.textContent = "❌ Server error. Please try again.";
            btn.disabled = false;
            return;
          }

          const data = await response.json();
          console.log("n8n response:", data);

          output.textContent =
            data.result || "❌ No result returned.";

        } catch (error) {
          console.error(error);
          output.textContent = "❌ Network error. Please try again.";
        }

        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
