<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("generateBtn");
    const output = document.getElementById("output");

    btn.addEventListener("click", async () => {
      const instructions = document.getElementById("instructions").value.trim();
      const homework = document.getElementById("text").value.trim();

      if (!instructions && !homework) {
        output.textContent = "❌ Please enter instructions or homework text.";
        return;
      }

      output.textContent = "⏳ Generating...";

      try {
        const response = await fetch(
          ("https://technixx26.app.n8n.cloud/webhook/homework-v2", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              question: homework,
              instructions: instructions,
              subject: "",
              length: "",
              format: "auto"
            })
          }
        );

        if (!response.ok) {
          output.textContent = "❌ Error: Server returned an error.";
          return;
        }

        const data = await response.json();
        console.log("Response from n8n:", data);

        // IMPORTANT: workflow returns `result`, not `answer`
        output.textContent =
          data.result || "❌ No result returned from AI.";
      } catch (err) {
        console.error(err);
        output.textContent = "❌ A network error occurred.";
      }
    });
  });
</script>
