<script>
document.getElementById("generateBtn").addEventListener("click", async () => {
  const instructions = document.getElementById("instructions").value;
  const homework = document.getElementById("text").value;

  const output = document.getElementById("output");
  output.textContent = "⏳ Generating...";

  try {
    const response = await fetch("https://technixx26.app.n8n.cloud/webhook/teacher-reference", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        instructions: instructions,
        text: homework,
        mode: "text",
      }),
    });

    if (!response.ok) {
      output.textContent = "❌ Error: Server returned an error.";
      return;
    }

    const data = await response.json();

    console.log("WEBSITE RECEIVED:", data);

    output.textContent = data.answer || "❌ No answer returned.";
  } catch (err) {
    output.textContent = "❌ Network or server error.";
    console.error(err);
  }
});
</script>
