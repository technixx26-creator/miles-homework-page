<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miles' Homework Helper</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px;
    }

    .container {
      background: white;
      max-width: 900px;
      margin: auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 140px;
      margin-top: 6px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 25px;
      cursor: pointer;
    }

    #output {
      margin-top: 25px;
      background: #eee;
      padding: 15px;
      white-space: pre-wrap;
      border-radius: 6px;
      min-height: 120px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Miles' Homework Helper</h1>

    <label>Teacher Instructions</label>
    <textarea id="instructions" placeholder="What does your professor want?"></textarea>

    <label>Homework Text / Question</label>
    <textarea id="question" placeholder="Paste the assignment or question here..."></textarea>

    <label>Upload files (PDF, DOCX, TXT, images)</label>
    <input
      type="file"
      id="files"
      multiple
      accept=".pdf,.docx,.txt,.png,.jpg,.jpeg"
    />

    <button id="generateBtn">Generate</button>

    <div id="output">Ready.</div>
  </div>

  <script>
    console.log("✅ Homework Helper loaded");

    document.getElementById("generateBtn").onclick = async () => {
      const instructions = document.getElementById("instructions").value.trim();
      const question = document.getElementById("question").value.trim();
      const files = document.getElementById("files").files;
      const output = document.getElementById("output");

      if (!instructions && !question && files.length === 0) {
        output.textContent = "❌ Please enter instructions, a question, or upload a file.";
        return;
      }

      output.textContent = "⏳ Generating response...";

      try {
        // --- Build multipart form ---
        const formData = new FormData();
        formData.append("context", instructions);   // MUST match n8n
        formData.append("question", question);

        for (let i = 0; i < files.length; i++) {
          formData.append("files", files[i]);
        }

        // --- Send to n8n webhook ---
        const response = await fetch(
          "https://technixx26.app.n8n.cloud/webhook-test/homework-v2",
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          output.textContent = `❌ Server error (${response.status})`;
          return;
        }

        // --- Safely handle ANY n8n response type ---
        let finalText = "";
        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
          const data = await response.json();
          console.log("n8n JSON response:", data);

          if (Array.isArray(data)) {
            finalText =
              data[0]?.merged_text ||
              data[0]?.result ||
              JSON.stringify(data, null, 2);
          } else {
            finalText =
              data.merged_text ||
              data.result ||
              JSON.stringify(data, null, 2);
          }
        } else {
          // text/plain fallback
          finalText = await response.text();
        }

        output.textContent = finalText || "❌ No output returned from workflow.";

      } catch (err) {
        console.error("Frontend error:", err);
        output.textContent = "❌ Network or JS error. Check console.";
      }
    };
  </script>
</body>
</html>
