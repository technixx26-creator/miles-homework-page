<!DOCTYPE html>
<html>
<head>
  <title>MilesAI - Teacher Reference Generator</title>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
    }
    button {
      padding: 12px 25px; 
      font-size: 16px; 
      cursor: pointer; 
      background: black; 
      color: white; 
      border-radius: 6px;
      border: none;
    }
    pre {
      background: #f4f4f4; 
      padding: 20px; 
      border-radius: 8px; 
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h2>MilesAI — Teacher Reference Generator</h2>
  <p>Paste the assignment instructions and homework text below, then click Generate.</p>

  <form id="hwForm">

    <label><strong>Assignment Instructions:</strong></label><br>
    <textarea 
      id="assignment_prompt" 
      name="assignment_prompt" 
      rows="4" 
      placeholder="Example: Write a 1-paragraph summary, answer questions #1–5, explain the concept of supply elasticity, etc."
      required></textarea><br><br>

    <label><strong>Homework Text:</strong></label><br>
    <textarea 
      id="input_text" 
      name="input_text" 
      rows="12"
      placeholder="Paste the homework text, questions, or reading here..."></textarea><br><br>

    <input type="hidden" name="mode" value="text">

    <button type="submit">Generate Reference</button>
  </form>

  <h3 style="margin-top: 40px;">Output:</h3>
  <pre id="output">Waiting for input...</pre>

<script>
document.getElementById("hwForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  document.getElementById("output").textContent = "Generating...";

  const assignmentPrompt = document.getElementById("assignment_prompt").value.trim();
  const inputText = document.getElementById("input_text").value.trim();

  const payload = {
    assignment_prompt: assignmentPrompt,
    input_text: inputText,
    mode: "text"
  };

  try {
    const response = await fetch("https://technixx26.app.n8n.cloud/webhook/teacher-reference", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await response.json();
    document.getElementById("output").textContent = result.answer || "No answer received.";
  } catch (err) {
    document.getElementById("output").textContent = "Error: " + err.message;
  }
});
</script>

</body>
</html>
