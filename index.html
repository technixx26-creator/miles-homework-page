<!DOCTYPE html>
<html>
<head>
    <title>MilesAI — Teacher Reference Generator</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; }
        #output { white-space: pre-wrap; padding: 15px; background: #f5f5f5; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>

<body>

<h2>Assignment Instructions:</h2>
<textarea id="instructions"></textarea>

<h2>Homework Text:</h2>
<textarea id="text"></textarea>

<button id="generateBtn">Generate Reference</button>

<h2>Output:</h2>
<div id="output"></div>

<script>
document.getElementById("generateBtn").addEventListener("click", async () => {

    const instructions = document.getElementById("instructions").value;
    const text = document.getElementById("text").value;

    const output = document.getElementById("output");
    output.textContent = "⏳ Generating...";

    try {
        const response = await fetch("https://technixx26.app.n8n.cloud/webhook/Path: teacher-reference", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                text: text,
                instructions: instructions
            }),
        });

        const data = await response.json();
        output.textContent = data.result || "❌ No result returned.";

    } catch (err) {
        output.textContent = "❌ Error: " + err.message;
    }
});
</script>

</body>
</html>
