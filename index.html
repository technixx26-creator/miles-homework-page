<style>
  body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .container {
    background: white;
    width: 90%;
    max-width: 800px;
    margin-top: 60px;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }

  h1 {
    text-align: center;
    margin-bottom: 40px;
    font-size: 32px;
    font-weight: 700;
  }

  label {
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
    font-size: 18px;
  }

  textarea {
    width: 100%;
    height: 140px;
    padding: 14px;
    margin-bottom: 25px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: vertical;
  }

  button {
    width: 100%;
    padding: 14px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  button:hover {
    background: #333;
  }

  #output {
    margin-top: 30px;
    background: #f3f3f3;
    padding: 20px;
    border-radius: 10px;
    min-height: 50px;
    font-size: 17px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
</style>

<body>
  <div class="container">
    <h1>Miles' Homework Helper</h1>

    <label>Instructions</label>
    <textarea id="instructions" placeholder="Describe what the teacher wants..."></textarea>

    <label>Your Text</label>
    <textarea id="text" placeholder="Paste your essay or homework text here..."></textarea>

    <button id="generateBtn">Generate</button>

    <div id="output"></div>
  </div>
</body>
