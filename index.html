<script>
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("generateBtn");
  const output = document.getElementById("output");

  btn.addEventListener("click", async () => {
    const instructions = document.getElementById("instructions").value;
    const homework = document.getElementById("text").value;

    output.textContent = "⏳ Generating...";

    try {
      const response = await fetch(
        "https://technixx26.app.n8n.cloud/webhook/teacher-reference",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            instructions: instructions,
            text: homework,
            mode: "text",
          }),
        }
      );

      if (!response.ok) {
        output.textContent = "❌ Error: Failed to reach server.";
        return;
      }

      const data = await response.json();
      console.log("Received from n8n:", data);

      output.textContent = data.answer || "❌ No answer returned.";
    } catch (err) {
      console.error(err);
      output.textContent = "❌ A network or script error occurred.";
    }
  });
});
</script>
