<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miles' Homework Helper</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 900px;
      margin-top: 40px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 15px 0 5px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      resize: vertical;
    }

    input[type="file"] {
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      font-size: 18px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #output {
      background: #eee;
      margin-top: 30px;
      padding: 20px;
      min-height: 80px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Miles' Homework Helper</h1>

    <label for="instructions">Instructions</label>
    <textarea id="instructions" placeholder="Describe what the teacher wants..."></textarea>

    <label for="text">Your Text</label>
    <textarea id="text" placeholder="Paste your essay or homework text here..."></textarea>

    <!-- FILE UPLOAD (NEW) -->
    <label>
      Upload files (PDF, DOCX, TXT, images)
    </label>
    <input
      type="file"
      id="fileInput"
      multiple
      accept=".pdf,.docx,.txt,.png,.jpg,.jpeg"
    />

    <button id="generateBtn">Generate</button>

    <div id="output"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("generateBtn");
      const output = document.getElementById("output");

      btn.addEventListener("click", async () => {
        const instructions = document.getElementById("instructions").value;
        const homework = document.getElementById("text").value;
        const files = document.getElementById("fileInput").files;

        output.textContent = "⏳ Generating...";

        try {
          const formData = new FormData();
          formData.append("instructions", instructions);
          formData.append("text", homework);
          formData.append("mode", "auto");

          for (let i = 0; i < files.length; i++) {
            formData.append("files", files[i]); // MUST be "files"
          }

          const response = await fetch(
            "https://technixx26.app.n8n.cloud/webhook/homework-submit",
            {
              method: "POST",
              body: formData
            }
          );

          if (!response.ok) {
            output.textContent = "❌ Error: Server did not return a valid response.";
            return;
          }

          const data = await response.json();
          console.log("Response from n8n:", data);

          output.textContent = data.answer || "❌ No answer returned.";
        } catch (err) {
          console.error(err);
          output.textContent = "❌ A network error occurred.";
        }
      });
    });
  </script>
</body>
</html>
