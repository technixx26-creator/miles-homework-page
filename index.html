<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miles' Homework Helper</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 800px;
      margin-top: 40px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 32px;
      font-weight: 700;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 14px;
      margin-bottom: 25px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #333;
    }

    #output {
      margin-top: 30px;
      background: #f3f3f3;
      padding: 20px;
      border-radius: 10px;
      min-height: 50px;
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
<div class="container">
<h1>Miles' Homework Helper</h1>

    <label>Instructions</label>
    <label for="instructions">Instructions</label>
<textarea id="instructions" placeholder="Describe what the teacher wants..."></textarea>

    <label>Your Text</label>
    <label for="text">Your Text</label>
<textarea id="text" placeholder="Paste your essay or homework text here..."></textarea>

<button id="generateBtn">Generate</button>

<div id="output"></div>
</div>

 <script>
document.getElementById("generateBtn").addEventListener("click", async () => {
  const instructions = document.getElementById("instructions").value;
  const homework = document.getElementById("text").value;

  const output = document.getElementById("output");
  output.textContent = "⏳ Generating...";

  try {
    const response = await fetch("https://technixx26.app.n8n.cloud/webhook/teacher-reference", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        instructions: instructions,
        text: homework,
        mode: "text"
      })
    });

    const data = await response.json();

    output.textContent = data.cleaned || "❌ No answer returned.";

  } catch (error) {
    output.textContent = "❌ Error: " + error.message;
  }
});
</script>
